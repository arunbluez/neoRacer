name: Rally Lab

on:
  push:
    branches: [main]
    paths: ['rally-lab/**', '.github/workflows/rally-lab.yml']
  pull_request:
    paths: ['rally-lab/**', '.github/workflows/rally-lab.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rally-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rally-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rally-lab/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          RALLY_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: rally-lab/dist

  deploy:
    # Deploys from main, or from any branch when run by hand (Actions → Rally Lab → Run workflow).
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
